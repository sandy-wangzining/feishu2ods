# ruff 检查配置（与 api2ods / sftp2ods 保持一致：pip install ruff && ruff check .）
line-length = 120
exclude = ["venv", ".venv", "build", "dist", "__pycache__"]

[lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP"]
ignore = [
    "E501",    # 行宽：长注释/日志字符串多，120 字符也可能超
    "UP009",   # 保留文件头「# -*- coding: utf-8 -*-」：跨工具查看更直观
    "UP015",   # open(mode="r") 显式写 mode，保留可读性
]

[lint.per-file-ignores]
"tests/*" = ["E402"]   # 测试先插 sys.path 再 import
