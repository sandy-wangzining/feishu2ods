[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu2ods"
version = "1.5.0"
description = "飞书多维表格（Base）→ MaxCompute ODS 同步工具（json + pt 分区，独立暂存表校验后原子发布）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "feishu2ods contributors" }]
keywords = ["maxcompute", "odps", "feishu", "bitable", "base", "etl", "data-ingestion", "data-warehouse"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "simplejson>=4.2",
  "requests>=2.25",
  "pyodps>=0.11",
  "tzdata>=2023.3; platform_system == 'Windows'",
]

[project.scripts]
feishu2ods = "feishu2ods.cli:main"

[project.urls]
Homepage = "https://github.com/sandy-wangzining/feishu2ods"
Source = "https://github.com/sandy-wangzining/feishu2ods"
Issues = "https://github.com/sandy-wangzining/feishu2ods/issues"

[project.optional-dependencies]
# ruff 锁版本：格式化判定（ruff format --check）必须本地与 CI 完全一致，避免版本漂移造成意外失败；
# 升级时改这里并本地跑一次 ruff format .（格式化结果有变化就一并提交）。锁法与 api2ods/sftp2ods 一致。
dev = ["ruff==0.16.9"]

[tool.setuptools]
packages = ["feishu2ods"]

[tool.ruff]
line-length = 120
exclude = ["venv", ".venv", "build", "dist", "__pycache__", ".run-locks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP"]
ignore = [
  "E501",    # 长行：中文说明/日志字符串多，120 列仍可能超
  "UP009",   # 保留文件头的 # -*- coding: utf-8 -*-（团队习惯，便于跨工具查看）
  "UP015",   # open(mode="r") 显式写法保留（可读性）
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # 测试先插 sys.path 再 import
