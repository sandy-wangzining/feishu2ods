name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖（含开发依赖）
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: 公共源码一致性（离线）
        run: python tools/sync_common.py --check

      - name: 静态检查（ruff）
        run: ruff check .

      - name: 格式检查（ruff format）
        run: ruff format --check .

      - name: 单元测试（离线，不访问网络/数仓）
        run: python -m unittest discover -s tests -v

      - name: wheel 独立安装检查
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').glob('*.whl')); subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)"
          python -I -c "import feishu2ods._common"
          python -I -m feishu2ods --help
